<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Virtual Tour A-Frame</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      
      /* Controlli VR personalizzati */
      .vr-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        gap: 10px;
      }
      
      .vr-btn {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 18px;
        transition: background 0.3s;
      }
      
      .vr-btn:hover {
        background: rgba(0, 0, 0, 0.9);
      }
      
      .vr-btn:active {
        transform: scale(0.95);
      }
      
      .fullscreen-btn {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 18px;
        transition: background 0.3s;
      }
      
      .fullscreen-btn:hover {
        background: rgba(0, 0, 0, 0.9);
      }
      
      .fullscreen-btn:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <a-scene id="scene" 
             vr-mode-ui="enabled: true" 
             device-orientation-permission-ui="enabled: true"
             embedded
             background="color: #000000">
      <a-sky id="image-360" 
             rotation="0 -130 0" 
             material="side: back"
             geometry="radius: 500"></a-sky>
      
      <!-- Camera con controlli -->
      <a-camera look-controls="enabled: true; reverseMouseDrag: false"
                wasd-controls="enabled: false"
                position="0 1.6 0">
      </a-camera>
    </a-scene>

    <!-- Controlli personalizzati -->
    <div class="vr-controls">
      <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Schermo intero">
        ⛶
      </button>
      <button class="vr-btn" onclick="enterVR()" title="Modalità VR">
        🥽
      </button>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const imgName = params.get("img");
      let scene;

      if (imgName) {
        const fullPath = "../src/imgs/360/" + imgName;
        const skyElement = document.getElementById("image-360");
        skyElement.setAttribute("src", fullPath);
        
        // Aspetta che l'immagine sia caricata
        skyElement.addEventListener('materialtextureloaded', function() {
          console.log('Immagine 360° caricata correttamente');
        });
      } else {
        alert("⚠️ Nessuna immagine specificata!");
      }

      // Inizializza la scena quando è pronta
      document.addEventListener('DOMContentLoaded', function() {
        scene = document.querySelector('a-scene');
        
        // Evento quando la scena è caricata
        scene.addEventListener('loaded', function() {
          console.log('Scena A-Frame caricata');
        });
        
        // Gestisci eventi VR
        scene.addEventListener('enter-vr', function() {
          console.log('Entrato in modalità VR');
          // Forza fullscreen quando entra in VR
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
              console.log('Errore fullscreen in VR:', err);
            });
          }
        });
        
        scene.addEventListener('exit-vr', function() {
          console.log('Uscito da modalità VR');
        });
      });

      // Funzione per entrare in modalità VR
      function enterVR() {
        const scene = document.querySelector('a-scene');
        
        // Prima entra in fullscreen
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().then(() => {
            // Dopo che è entrato in fullscreen, attiva VR
            setTimeout(() => {
              if (scene && scene.is && scene.is('vr-mode')) {
                scene.exitVR();
              } else {
                scene.enterVR();
              }
            }, 500);
          }).catch(err => {
            console.log('Errore fullscreen:', err);
            // Se fallisce il fullscreen, prova comunque VR
            if (scene && scene.is && scene.is('vr-mode')) {
              scene.exitVR();
            } else {
              scene.enterVR();
            }
          });
        } else {
          // Se è già in fullscreen, toggle VR
          if (scene && scene.is && scene.is('vr-mode')) {
            scene.exitVR();
          } else {
            scene.enterVR();
          }
        }
      }

      // Funzione per il fullscreen
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.log('Errore fullscreen:', err);
          });
        } else {
          document.exitFullscreen();
        }
      }

      // Richiedi permessi giroscopio su iOS
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(response => {
            console.log('Permesso giroscopio:', response);
          })
          .catch(console.error);
      }

      // Gestisci eventi fullscreen
      document.addEventListener('fullscreenchange', function() {
        const vrControls = document.querySelector('.vr-controls');
        if (document.fullscreenElement) {
          console.log('Entrato in fullscreen');
          // Nascondi i controlli in fullscreen per una migliore esperienza VR
          if (vrControls) vrControls.style.display = 'none';
        } else {
          console.log('Uscito da fullscreen');
          // Mostra i controlli quando esce da fullscreen
          if (vrControls) vrControls.style.display = 'flex';
        }
      });
    </script>
  </body>
</html>
