<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Panorama 360°</title>
    <meta name="description" content="Panorama VR 360°">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1000;
            font-size: 18px;
        }
        
        .loading-spinner {
            border: 3px solid #333;
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="loading-spinner"></div>
        <span>Caricamento panorama...</span>
    </div>

    <a-scene 
        background="color: #000"
        vr-mode-ui="enabled: true"
        device-orientation-permission-ui="enabled: true"
        embedded
        style="height: 100vh; width: 100vw;">
        
        <a-assets>
            <img id="panorama" crossorigin="anonymous" />
        </a-assets>
        
        <a-sky id="sky" radius="500" rotation="0 0 0"></a-sky>
        
        <a-camera 
            look-controls="reverseMouseDrag: true; reverseTouchDrag: true"
            wasd-controls="enabled: false"
            position="0 1.6 0">
        </a-camera>
    </a-scene>

    <script>
        let panoramaLoaded = false;
        
        // Funzione per ottenere il parametro img dall'URL
        function getImageParameter() {
            const urlParams = new URLSearchParams(window.location.search);
            const imgParam = urlParams.get('img');
            console.log('Parametro img:', imgParam);
            return imgParam;
        }
        
        // Funzione per caricare l'immagine panoramica
        function loadPanorama() {
            const loadingScreen = document.getElementById('loadingScreen');
            const panoramaImg = document.getElementById('panorama');
            const sky = document.getElementById('sky');
            
            let imageUrl = getImageParameter();
            
            if (!imageUrl) {
                console.error('Nessun parametro img fornito');
                loadingScreen.innerHTML = '<span style="color: red;">Errore: Nessuna immagine specificata</span>';
                return;
            }
            
            // Se il percorso non inizia con http:// o https:// e non inizia con ../
            // aggiungi ../ per tornare alla root del sito
            if (!imageUrl.startsWith('http') && !imageUrl.startsWith('../')) {
                imageUrl = '../' + imageUrl;
            }
            
            console.log('Caricamento immagine:', imageUrl);
            
            // Timeout di sicurezza
            const loadTimeout = setTimeout(() => {
                if (!panoramaLoaded) {
                    console.error('Timeout nel caricamento dell\'immagine');
                    loadingScreen.innerHTML = `
                        <div style="text-align: center; color: white;">
                            <div style="color: orange; font-size: 20px; margin-bottom: 10px;">⏱️ Timeout</div>
                            <div style="margin-bottom: 10px;">Il caricamento sta impiegando troppo tempo</div>
                            <div style="font-size: 14px; opacity: 0.8; word-break: break-all;">${imageUrl}</div>
                            <button onclick="location.reload()" style="
                                margin-top: 15px;
                                padding: 10px 20px;
                                background: #FF9800;
                                color: white;
                                border: none;
                                border-radius: 5px;
                                cursor: pointer;
                            ">🔄 Riprova</button>
                        </div>
                    `;
                }
            }, 15000); // 15 secondi di timeout
            
            panoramaImg.onload = function() {
                clearTimeout(loadTimeout);
                console.log('Immagine caricata con successo');
                console.log('Dimensioni immagine:', this.naturalWidth, 'x', this.naturalHeight);
                sky.setAttribute('src', '#panorama');
                loadingScreen.style.display = 'none';
                panoramaLoaded = true;
            };
            
            panoramaImg.onerror = function() {
                clearTimeout(loadTimeout);
                console.error('Errore nel caricamento dell\'immagine:', imageUrl);
                loadingScreen.innerHTML = `
                    <div style="text-align: center; color: white;">
                        <div style="color: red; font-size: 20px; margin-bottom: 10px;">⚠️ Errore Caricamento</div>
                        <div style="margin-bottom: 10px;">Impossibile caricare l'immagine panoramica</div>
                        <div style="font-size: 14px; opacity: 0.8; word-break: break-all;">${imageUrl}</div>
                        <button onclick="location.reload()" style="
                            margin-top: 15px;
                            padding: 10px 20px;
                            background: #4CAF50;
                            color: white;
                            border: none;
                            border-radius: 5px;
                            cursor: pointer;
                        ">🔄 Riprova</button>
                    </div>
                `;
            };
            
            panoramaImg.src = imageUrl;
        }
        
        // Funzioni globali per i controlli
        window.resetView = function() {
            console.log('Reset vista');
            const camera = document.querySelector('a-camera');
            if (camera) {
                camera.setAttribute('rotation', '0 0 0');
                camera.setAttribute('position', '0 1.6 0');
            }
        };
        
        window.toggleFullscreen = function() {
            console.log('Toggle fullscreen richiesto');
            
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.mozRequestFullScreen) {
                    document.documentElement.mozRequestFullScreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        };
        
        window.enterVR = function() {
            console.log('Modalità VR richiesta');
            const scene = document.querySelector('a-scene');
            if (scene && scene.enterVR) {
                console.log('Attivazione VR nativa A-Frame...');
                
                // Per iOS, richiedi permessi per i sensori di movimento
                if (typeof DeviceOrientationEvent !== 'undefined' && 
                    typeof DeviceOrientationEvent.requestPermission === 'function') {
                    
                    DeviceOrientationEvent.requestPermission()
                        .then(permissionState => {
                            console.log('Stato permessi iOS:', permissionState);
                            if (permissionState === 'granted') {
                                // Attiva VR dopo aver ottenuto i permessi
                                scene.enterVR().then(() => {
                                    console.log('VR attivato con successo');
                                    // Notifica il parent del successo
                                    window.parent.postMessage({ 
                                        action: 'vrActivated', 
                                        success: true 
                                    }, '*');
                                }).catch(error => {
                                    console.error('Errore attivazione VR:', error);
                                    window.parent.postMessage({ 
                                        action: 'vrActivated', 
                                        success: false, 
                                        error: error.message 
                                    }, '*');
                                });
                            } else {
                                console.log('Permessi iOS negati, tentativo VR senza permessi');
                                scene.enterVR();
                            }
                        })
                        .catch(error => {
                            console.error('Errore richiesta permessi iOS:', error);
                            // Prova comunque ad attivare VR
                            scene.enterVR();
                        });
                        
                } else {
                    // Non iOS o permessi non necessari
                    scene.enterVR().then(() => {
                        console.log('VR attivato con successo');
                        window.parent.postMessage({ 
                            action: 'vrActivated', 
                            success: true 
                        }, '*');
                    }).catch(error => {
                        console.error('Errore attivazione VR:', error);
                        window.parent.postMessage({ 
                            action: 'vrActivated', 
                            success: false, 
                            error: error.message 
                        }, '*');
                    });
                }
                
            } else {
                console.log('VR non supportato o non disponibile');
                window.parent.postMessage({ 
                    action: 'vrActivated', 
                    success: false, 
                    error: 'VR non supportato su questo dispositivo' 
                }, '*');
            }
        };
        
        // Inizializza al caricamento della pagina
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM caricato, inizializzazione panorama');
            loadPanorama();
        });
        
        // Gestisci messaggi dal parent (opzionale, per compatibilità)
        window.addEventListener('message', function(event) {
            console.log('Messaggio ricevuto:', event.data);
            
            if (event.data && event.data.action) {
                switch(event.data.action) {
                    case 'toggleFullscreen':
                        toggleFullscreen();
                        break;
                    case 'enterVR':
                    case 'toggleVRMode':
                        console.log('Comando VR ricevuto dal parent');
                        enterVR();
                        break;
                    case 'resetView':
                        resetView();
                        break;
                }
            }
        });
        
        // Debug: Stampa informazioni sulla scena A-Frame
        document.querySelector('a-scene').addEventListener('loaded', function() {
            console.log('A-Frame scene caricata');
            console.log('VR supportato:', AFRAME.utils.device.checkHeadsetConnected());
            
            // Aggiungi listener per entrata e uscita VR
            const scene = document.querySelector('a-scene');
            
            scene.addEventListener('enter-vr', function() {
                console.log('Entrato in modalità VR');
                window.parent.postMessage({ 
                    action: 'vrEntered',
                    inVR: true 
                }, '*');
            });
            
            scene.addEventListener('exit-vr', function() {
                console.log('Uscito dalla modalità VR');
                window.parent.postMessage({ 
                    action: 'vrExited',
                    inVR: false 
                }, '*');
            });
        });
    </script>
</body>
</html>
