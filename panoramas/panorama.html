<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Virtual Tour A-Frame</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene>
      <a-sky id="image-360" rotation="0 -130 0"></a-sky>
    </a-scene>

    <script>
      const params = new URLSearchParams(window.location.search);
      const imgName = params.get("img");

      if (imgName) {
        const fullPath = "../src/imgs/360/" + imgName;
        document.getElementById("image-360").setAttribute("src", fullPath);
      } else {
        alert("⚠️ Nessuna immagine specificata!");
      }
    </script>
  </body>
</html>
