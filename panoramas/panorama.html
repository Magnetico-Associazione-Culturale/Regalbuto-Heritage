<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Panorama 360°</title>
    <meta name="description" content="Panorama VR 360°">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1000;
            font-size: 18px;
        }
        
        .loading-spinner {
            border: 3px solid #333;
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="loading-spinner"></div>
        <span>Caricamento panorama...</span>
    </div>

    <a-scene 
        background="color: #000"
        vr-mode-ui="enabled: true"
        device-orientation-permission-ui="enabled: true"
        renderer="antialias: true; colorManagement: true; sortObjects: true"
        embedded
        style="height: 100vh; width: 100vw;">
        
        <a-assets>
            <img id="panorama" crossorigin="anonymous" />
        </a-assets>
        
        <a-sky id="sky" radius="500" rotation="0 0 0" material="shader: standard"></a-sky>
        
        <a-camera 
            look-controls="reverseMouseDrag: true; reverseTouchDrag: true"
            wasd-controls="enabled: false"
            position="0 1.6 0"
            fov="80">
        </a-camera>
    </a-scene>

    <script>
        let panoramaLoaded = false;
        
        // Funzione per ottenere il parametro img dall'URL
        function getImageParameter() {
            const urlParams = new URLSearchParams(window.location.search);
            const imgParam = urlParams.get('img');
            console.log('Parametro img:', imgParam);
            return imgParam;
        }
        
        // Funzione per ottenere il parametro rotation dall'URL
        function getRotationParameter() {
            const urlParams = new URLSearchParams(window.location.search);
            const rotationParam = urlParams.get('rotation');
            const rotation = rotationParam ? parseInt(rotationParam) : -90; // Default -90 gradi (90° sinistra)
            console.log('Parametro rotation:', rotation);
            return rotation;
        }
        
        // Funzione per caricare l'immagine panoramica
        function loadPanorama() {
            const loadingScreen = document.getElementById('loadingScreen');
            const panoramaImg = document.getElementById('panorama');
            const sky = document.getElementById('sky');
            
            let imageUrl = getImageParameter();
            
            if (!imageUrl) {
                console.error('Nessun parametro img fornito');
                loadingScreen.innerHTML = '<span style="color: red;">Errore: Nessuna immagine specificata</span>';
                return;
            }
            
            // Se il percorso non inizia con http:// o https:// e non inizia con ../
            // aggiungi ../ per tornare alla root del sito
            if (!imageUrl.startsWith('http') && !imageUrl.startsWith('../')) {
                imageUrl = '../' + imageUrl;
            }
            
            console.log('Caricamento immagine:', imageUrl);
            
            // Timeout di sicurezza
            const loadTimeout = setTimeout(() => {
                if (!panoramaLoaded) {
                    console.error('Timeout nel caricamento dell\'immagine');
                    loadingScreen.innerHTML = `
                        <div style="text-align: center; color: white;">
                            <div style="color: orange; font-size: 20px; margin-bottom: 10px;">⏱️ Timeout</div>
                            <div style="margin-bottom: 10px;">Il caricamento sta impiegando troppo tempo</div>
                            <div style="font-size: 14px; opacity: 0.8; word-break: break-all;">${imageUrl}</div>
                            <button onclick="location.reload()" style="
                                margin-top: 15px;
                                padding: 10px 20px;
                                background: #FF9800;
                                color: white;
                                border: none;
                                border-radius: 5px;
                                cursor: pointer;
                            ">🔄 Riprova</button>
                        </div>
                    `;
                }
            }, 15000); // 15 secondi di timeout
            
            panoramaImg.onload = function() {
                clearTimeout(loadTimeout);
                console.log('Immagine caricata con successo');
                console.log('Dimensioni immagine:', this.naturalWidth, 'x', this.naturalHeight);
                
                // Aspetta che A-Frame sia completamente inizializzato
                setTimeout(() => {
                    sky.setAttribute('src', '#panorama');
                    console.log('Texture applicata al sky element');
                    
                    // Applica la rotazione
                    const rotation = getRotationParameter();
                    sky.setAttribute('rotation', `0 ${rotation} 0`);
                    console.log('Rotazione applicata:', `0 ${rotation} 0`);
                    
                    // Verifica che la texture sia stata applicata
                    setTimeout(() => {
                        const skyMaterial = sky.components.material;
                        if (skyMaterial && skyMaterial.material && skyMaterial.material.map) {
                            console.log('Texture caricata correttamente nel materiale');
                        } else {
                            console.warn('Possibile problema con il caricamento della texture');
                        }
                    }, 1000);
                    
                }, 100);
                
                loadingScreen.style.display = 'none';
                panoramaLoaded = true;
            };
            
            panoramaImg.onerror = function() {
                clearTimeout(loadTimeout);
                console.error('Errore nel caricamento dell\'immagine:', imageUrl);
                loadingScreen.innerHTML = `
                    <div style="text-align: center; color: white;">
                        <div style="color: red; font-size: 20px; margin-bottom: 10px;">⚠️ Errore Caricamento</div>
                        <div style="margin-bottom: 10px;">Impossibile caricare l'immagine panoramica</div>
                        <div style="font-size: 14px; opacity: 0.8; word-break: break-all;">${imageUrl}</div>
                        <button onclick="location.reload()" style="
                            margin-top: 15px;
                            padding: 10px 20px;
                            background: #4CAF50;
                            color: white;
                            border: none;
                            border-radius: 5px;
                            cursor: pointer;
                        ">🔄 Riprova</button>
                    </div>
                `;
            };
            
            panoramaImg.src = imageUrl;
        }
        
        // Funzioni globali per i controlli
        window.resetView = function() {
            console.log('Reset vista');
            const camera = document.querySelector('a-camera');
            if (camera) {
                camera.setAttribute('rotation', '0 0 0');
                camera.setAttribute('position', '0 1.6 0');
            }
        };
        
        window.toggleFullscreen = function() {
            console.log('Toggle fullscreen richiesto');
            
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.mozRequestFullScreen) {
                    document.documentElement.mozRequestFullScreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        };
        
        window.enterVR = function() {
            console.log('Modalità VR richiesta');
            const scene = document.querySelector('a-scene');
            const sky = document.getElementById('sky');
            const panoramaImg = document.getElementById('panorama');
            
            if (!scene || !scene.enterVR) {
                console.error('A-Frame scene o VR non disponibile');
                window.parent.postMessage({ 
                    action: 'vrActivated', 
                    success: false, 
                    error: 'VR non supportato su questo dispositivo' 
                }, '*');
                return;
            }
            
            // Verifica rigorosa della disponibilità della texture
            console.log('Controllo stato texture per VR...');
            console.log('panoramaLoaded:', panoramaLoaded);
            console.log('Image complete:', panoramaImg.complete);
            console.log('Sky src:', sky.getAttribute('src'));
            
            // Funzione per verificare se la texture è effettivamente pronta
            function isTextureReady() {
                const skyMaterial = sky.components.material;
                return panoramaLoaded && 
                       panoramaImg.complete && 
                       sky.getAttribute('src') === '#panorama' &&
                       skyMaterial && 
                       skyMaterial.material && 
                       skyMaterial.material.map;
            }
            
            // Forza sempre il ricaricamento della texture per Android
            const isAndroid = /Android/i.test(navigator.userAgent);
            if (isAndroid || !isTextureReady()) {
                console.log('Android rilevato o texture non pronta, forzo ricaricamento...');
                
                // Reset e ricarica la texture
                sky.removeAttribute('src');
                
                setTimeout(() => {
                    // Assicura che l'immagine sia in cache
                    const tempImg = new Image();
                    tempImg.crossOrigin = 'anonymous';
                    tempImg.onload = function() {
                        console.log('Immagine ricaricata in cache per VR');
                        
                        // Riapplica la texture
                        sky.setAttribute('src', '#panorama');
                        
                        // Attendi più tempo per Android per processare la texture
                        setTimeout(() => {
                            console.log('Verifica finale texture prima VR...');
                            if (isTextureReady()) {
                                console.log('Texture verificata, attivando VR...');
                                attemptVRActivation(scene);
                            } else {
                                console.error('Texture ancora non pronta, tentativo VR comunque...');
                                // Su Android, prova comunque il VR anche se la texture sembra non pronta
                                attemptVRActivation(scene);
                            }
                        }, isAndroid ? 3000 : 2000); // Più tempo per Android
                    };
                    tempImg.onerror = function() {
                        console.error('Errore ricaricamento immagine per VR');
                        window.parent.postMessage({ 
                            action: 'vrActivated', 
                            success: false, 
                            error: 'Errore ricaricamento immagine per VR' 
                        }, '*');
                    };
                    tempImg.src = panoramaImg.src;
                }, 100);
                
                return;
            }
            
            // Se la texture è pronta, attiva direttamente il VR
            console.log('Texture pronta, attivando VR immediatamente...');
            attemptVRActivation(scene);
        };
        
        function attemptVRActivation(scene) {
            console.log('Attivazione VR nativa A-Frame...');
            
            // Controllo finale pre-VR
            const sky = document.getElementById('sky');
            const panoramaImg = document.getElementById('panorama');
            const isAndroid = /Android/i.test(navigator.userAgent);
            
            console.log('Controlli pre-VR:');
            console.log('- Device: Android =', isAndroid);
            console.log('- Scene ready:', !!scene);
            console.log('- Sky element:', !!sky);
            console.log('- Panorama image:', !!panoramaImg);
            console.log('- Image src:', panoramaImg.src);
            console.log('- Image complete:', panoramaImg.complete);
            console.log('- Sky src attribute:', sky.getAttribute('src'));
            
            // Verifica materiale A-Frame
            const skyComponent = sky.components.material;
            if (skyComponent && skyComponent.material) {
                console.log('- Material exists:', !!skyComponent.material);
                console.log('- Texture map exists:', !!skyComponent.material.map);
                if (skyComponent.material.map) {
                    console.log('- Texture image:', skyComponent.material.map.image);
                }
            }
            
            // Gestione specifica per Android
            if (isAndroid) {
                console.log('Gestione Android VR - attesa aggiuntiva...');
                
                // Forza il rendering prima del VR
                scene.renderOnDemand = false;
                
                // Aspetta che tutto sia renderizzato
                setTimeout(() => {
                    console.log('Android: Tentativo VR dopo rendering...');
                    performVRActivation(scene);
                }, 1000);
                
                return;
            }
            
            // Per iOS, richiedi permessi per i sensori di movimento
            if (typeof DeviceOrientationEvent !== 'undefined' && 
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                
                console.log('Richiesta permessi iOS per VR...');
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        console.log('Stato permessi iOS:', permissionState);
                        if (permissionState === 'granted') {
                            console.log('Permessi concessi, attivando VR...');
                            performVRActivation(scene);
                        } else {
                            console.log('Permessi iOS negati, tentativo VR senza permessi...');
                            performVRActivation(scene);
                        }
                    })
                    .catch(error => {
                        console.error('Errore richiesta permessi iOS:', error);
                        performVRActivation(scene);
                    });
                    
            } else {
                // Non iOS o permessi non necessari
                console.log('Attivando VR su dispositivo non-iOS...');
                performVRActivation(scene);
            }
        };
        
        function performVRActivation(scene) {
            console.log('Esecuzione attivazione VR...');
            
            scene.enterVR().then(() => {
                console.log('✅ VR attivato con successo');
                window.parent.postMessage({ 
                    action: 'vrActivated', 
                    success: true 
                }, '*');
                
                // Invia anche il messaggio di entrata in VR
                window.parent.postMessage({ 
                    action: 'vrEntered',
                    success: true 
                }, '*');
                
            }).catch(error => {
                console.error('❌ Errore attivazione VR:', error);
                window.parent.postMessage({ 
                    action: 'vrActivated', 
                    success: false, 
                    error: 'Errore VR: ' + error.message 
                }, '*');
            });
        }
        
        window.exitVR = function() {
            console.log('Uscita dalla modalità VR richiesta');
            const scene = document.querySelector('a-scene');
            
            if (!scene) {
                console.error('A-Frame scene non disponibile');
                return;
            }
            
            try {
                // Controlla se siamo in modalità VR
                if (scene.is('vr-mode')) {
                    console.log('Uscita dalla modalità VR...');
                    scene.exitVR();
                } else {
                    console.log('Non in modalità VR, nessuna azione richiesta');
                }
                
                // Invia messaggio al parent per confermare l'uscita
                window.parent.postMessage({ 
                    action: 'vrExited', 
                    success: true 
                }, '*');
                
            } catch (error) {
                console.error('Errore durante l\'uscita dal VR:', error);
                window.parent.postMessage({ 
                    action: 'vrExited', 
                    success: false, 
                    error: error.message 
                }, '*');
            }
        };
        
        // Inizializza al caricamento della pagina
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM caricato, inizializzazione panorama');
            loadPanorama();
        });
        
        // Gestisci messaggi dal parent (opzionale, per compatibilità)
        window.addEventListener('message', function(event) {
            console.log('Messaggio ricevuto:', event.data);
            
            if (event.data && event.data.action) {
                switch(event.data.action) {
                    case 'toggleFullscreen':
                        toggleFullscreen();
                        break;
                    case 'enterVR':
                    case 'toggleVRMode':
                        console.log('Comando VR ricevuto dal parent');
                        enterVR();
                        break;
                    case 'exitVR':
                        console.log('Comando uscita VR ricevuto dal parent');
                        exitVR();
                        break;
                    case 'resetView':
                        resetView();
                        break;
                }
            }
        });
        
        // Debug: Stampa informazioni sulla scena A-Frame
        document.querySelector('a-scene').addEventListener('loaded', function() {
            console.log('A-Frame scene caricata');
            console.log('VR supportato:', AFRAME.utils.device.checkHeadsetConnected());
            console.log('VR disponibile:', AFRAME.utils.device.isVRAvailable());
            
            // Aggiungi listener per entrata e uscita VR
            const scene = document.querySelector('a-scene');
            
            scene.addEventListener('enter-vr', function() {
                console.log('🕶️ Entrato in modalità VR');
                
                // Debug texture in VR
                const sky = document.getElementById('sky');
                const panoramaImg = document.getElementById('panorama');
                console.log('Sky element in VR:', sky);
                console.log('Panorama image in VR:', panoramaImg);
                console.log('Image source in VR:', panoramaImg.src);
                console.log('Image loaded in VR:', panoramaImg.complete);
                console.log('Sky src attribute in VR:', sky.getAttribute('src'));
                
                // WORKAROUND: Forza refresh texture in VR
                setTimeout(() => {
                    console.log('🔄 Forzando refresh texture in VR...');
                    
                    // Rimuovi e riapplica la texture
                    const currentSrc = sky.getAttribute('src');
                    sky.removeAttribute('src');
                    
                    setTimeout(() => {
                        sky.setAttribute('src', currentSrc);
                        console.log('✅ Texture riapplicata in modalità VR');
                        
                        // Verifica che sia stata applicata
                        setTimeout(() => {
                            const skyComponent = sky.components.material;
                            if (skyComponent && skyComponent.material) {
                                console.log('Material dopo refresh VR:', skyComponent.material);
                                console.log('Texture map dopo refresh VR:', skyComponent.material.map);
                                
                                if (!skyComponent.material.map) {
                                    console.error('❌ Texture ancora mancante dopo refresh!');
                                    // Ultimo tentativo con forza bruta
                                    const canvas = panoramaImg.ownerDocument.createElement('canvas');
                                    const ctx = canvas.getContext('2d');
                                    canvas.width = panoramaImg.naturalWidth || 2048;
                                    canvas.height = panoramaImg.naturalHeight || 1024;
                                    ctx.drawImage(panoramaImg, 0, 0);
                                    
                                    const dataURL = canvas.toDataURL('image/jpeg', 0.8);
                                    sky.setAttribute('src', dataURL);
                                    console.log('🎯 Applicata texture via canvas dataURL');
                                } else {
                                    console.log('✅ Texture correttamente caricata in VR!');
                                }
                            }
                        }, 1500);
                        
                    }, 100);
                }, 500);
                
                window.parent.postMessage({ 
                    action: 'vrEntered',
                    inVR: true 
                }, '*');
            });
            
            scene.addEventListener('exit-vr', function() {
                console.log('Uscito dalla modalità VR');
                window.parent.postMessage({ 
                    action: 'vrExited',
                    inVR: false 
                }, '*');
            });
        });
    </script>
</body>
</html>
