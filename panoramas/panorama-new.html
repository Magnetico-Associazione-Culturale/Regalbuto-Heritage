<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Panorama 360°</title>
    <meta name="description" content="Panorama VR 360°">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1000;
            font-size: 18px;
        }
        
        .loading-spinner {
            border: 3px solid #333;
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
        }
        
        .control-btn {
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: rgba(0,0,0,0.9);
            transform: scale(1.05);
        }
        
        .control-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="loading-spinner"></div>
        <span>Caricamento panorama...</span>
    </div>

    <a-scene 
        background="color: #000"
        vr-mode-ui="enabled: true"
        device-orientation-permission-ui="enabled: true"
        embedded
        style="height: 100vh; width: 100vw;">
        
        <a-assets>
            <img id="panorama" crossorigin="anonymous" />
        </a-assets>
        
        <a-sky id="sky" radius="500" rotation="0 0 0"></a-sky>
        
        <a-camera 
            look-controls="reverseMouseDrag: true; reverseTouchDrag: true"
            wasd-controls="enabled: false"
            position="0 1.6 0">
        </a-camera>
    </a-scene>

    <div class="controls">
        <button class="control-btn" onclick="resetView()">🎯 Centra Vista</button>
        <button class="control-btn" onclick="toggleFullscreen()">⛶ Schermo Intero</button>
        <button class="control-btn" onclick="enterVR()">🥽 Modalità VR</button>
    </div>

    <script>
        let panoramaLoaded = false;
        
        // Funzione per ottenere il parametro img dall'URL
        function getImageParameter() {
            const urlParams = new URLSearchParams(window.location.search);
            const imgParam = urlParams.get('img');
            console.log('Parametro img:', imgParam);
            return imgParam;
        }
        
        // Funzione per caricare l'immagine panoramica
        function loadPanorama() {
            const loadingScreen = document.getElementById('loadingScreen');
            const panoramaImg = document.getElementById('panorama');
            const sky = document.getElementById('sky');
            
            const imageUrl = getImageParameter();
            
            if (!imageUrl) {
                console.error('Nessun parametro img fornito');
                loadingScreen.innerHTML = '<span style="color: red;">Errore: Nessuna immagine specificata</span>';
                return;
            }
            
            console.log('Caricamento immagine:', imageUrl);
            
            panoramaImg.onload = function() {
                console.log('Immagine caricata con successo');
                sky.setAttribute('src', '#panorama');
                loadingScreen.style.display = 'none';
                panoramaLoaded = true;
            };
            
            panoramaImg.onerror = function() {
                console.error('Errore nel caricamento dell\'immagine');
                loadingScreen.innerHTML = '<span style="color: red;">Errore nel caricamento dell\'immagine</span>';
            };
            
            panoramaImg.src = imageUrl;
        }
        
        // Funzioni globali per i controlli
        window.resetView = function() {
            console.log('Reset vista');
            const camera = document.querySelector('a-camera');
            if (camera) {
                camera.setAttribute('rotation', '0 0 0');
                camera.setAttribute('position', '0 1.6 0');
            }
        };
        
        window.toggleFullscreen = function() {
            console.log('Toggle fullscreen richiesto');
            
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.mozRequestFullScreen) {
                    document.documentElement.mozRequestFullScreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        };
        
        window.enterVR = function() {
            console.log('Modalità VR richiesta');
            const scene = document.querySelector('a-scene');
            if (scene && scene.enterVR) {
                scene.enterVR();
            } else {
                console.log('VR non supportato o non disponibile');
            }
        };
        
        // Inizializza al caricamento della pagina
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM caricato, inizializzazione panorama');
            loadPanorama();
        });
        
        // Gestisci messaggi dal parent (opzionale, per compatibilità)
        window.addEventListener('message', function(event) {
            console.log('Messaggio ricevuto:', event.data);
            
            if (event.data && event.data.action) {
                switch(event.data.action) {
                    case 'toggleFullscreen':
                        toggleFullscreen();
                        break;
                    case 'enterVR':
                    case 'toggleVRMode':
                        enterVR();
                        break;
                    case 'resetView':
                        resetView();
                        break;
                }
            }
        });
        
        // Debug: Stampa informazioni sulla scena A-Frame
        document.querySelector('a-scene').addEventListener('loaded', function() {
            console.log('A-Frame scene caricata');
            console.log('VR supportato:', AFRAME.utils.device.checkHeadsetConnected());
        });
    </script>
</body>
</html>
